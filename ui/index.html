<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Zeres Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="win">
  <!-- fondo: panoramica 3D de Minecraft, difuminada -->
  <div class="pano" id="pano"><div class="cube" id="cube"></div></div>
  <div class="shade"></div>

  <!-- cabecera (se arrastra): logo con el texto amarillo y botones de ventana -->
  <header class="bar" data-tauri-drag-region>
    <div class="logo-box" data-tauri-drag-region>
      <img src="img/zeres_network.png" class="logo" alt="Zeres Network" data-tauri-drag-region>
      <span class="t splash" id="splash"></span>
    </div>
    <button class="mcbtn wb" id="wMin" title="Minimizar"><span class="t" id="wMinT"></span></button>
    <button class="mcbtn wb x" id="wClose" title="Cerrar"><span class="t" id="wCloseT"></span></button>
  </header>

  <!-- ============================================================ INICIO (estilo "Elegir mundo" de Minecraft) -->
  <main class="view on" id="v-home">
    <div class="list">
      <span class="t list-title" data-t="Elige dónde jugar"></span>
      <div class="inst" data-inst="cobblemon" title="Doble clic para jugar">
        <canvas width="64" height="64" class="ico"></canvas>
        <div class="txt"><span class="t" id="lbl-cobblemon"></span><span class="t" id="inf1-cobblemon"></span><span class="t" id="inf2-cobblemon"></span></div>
      </div>
      <div class="inst" data-inst="zeres" title="Doble clic para jugar">
        <canvas width="64" height="64" class="ico"></canvas>
        <div class="txt"><span class="t" id="lbl-zeres"></span><span class="t" id="inf1-zeres"></span><span class="t" id="inf2-zeres"></span></div>
      </div>
      <span class="t list-sub" data-t="§eServidor"></span>
      <div class="server" id="server" title="Pulsa para comprobar el servidor">
        <canvas width="64" height="64" id="favicon"></canvas>
        <div class="txt"><span class="t" id="srvName"></span><span class="t" id="srvMotd1"></span><span class="t" id="srvMotd2"></span></div>
        <div class="srv-right"><span class="t" id="srvPlayers"></span><i class="pingbar" id="pingbar"></i></div>
      </div>
    </div>
    <span class="t status" id="status"></span>
    <div class="btns">
      <button class="mcbtn play" id="play"><i class="fill" id="progBar"></i><span class="t" id="playT"></span></button>
      <button class="mcbtn w300" id="bProfile"><span class="t" data-t="Perfil"></span></button>
      <button class="mcbtn" id="bSettings"><span class="t" data-t="Ajustes"></span></button>
      <button class="mcbtn" id="bNews"><span class="t" data-t="Novedades"></span></button>
      <button class="mcbtn" id="bMods"><span class="t" data-t="Mods"></span></button>
      <button class="mcbtn" id="bFolder"><span class="t" data-t="Carpeta"></span></button>
    </div>
    <div class="acct" id="acct" title="Perfil y cuentas"><canvas width="8" height="8" id="sideHead"></canvas><span class="t" id="sideName"></span></div>
    <span class="t ver" id="barBeta"></span>
  </main>

  <!-- ============================================================ AJUSTES -->
  <section class="view menu" id="v-settings">
    <div class="m-head"><div class="tabs" id="tabs"></div></div>
    <div class="m-list" id="setList"></div>
    <div class="m-foot"><button class="mcbtn w300" data-home><span class="t" data-t="Hecho"></span></button></div>
  </section>

  <!-- ============================================================ PERFIL -->
  <section class="view prof" id="v-profile">
    <div class="prof-stage" id="stage">
      <div class="viewer" id="viewer"><div class="player" id="player"></div></div>
      <div class="prof-name"><span class="t" id="pName"></span><span class="t" id="pKind"></span></div>
      <span class="t prof-hint" data-t="Arrastra para girar" data-c="7"></span>
    </div>
    <div class="prof-side">
      <span class="t prof-title" data-t="Cuentas"></span>
      <div class="acc-list" id="accList"></div>
      <div class="prof-add">
        <button class="mcbtn" id="pOff"><span class="t" data-t="+ Sin premium"></span></button>
        <button class="mcbtn" id="pMs"><span class="t" data-t="+ Microsoft"></span></button>
      </div>
      <button class="mcbtn" data-home><span class="t" data-t="Hecho"></span></button>
    </div>
  </section>

  <!-- ============================================================ AÑADIR SIN PREMIUM -->
  <section class="view menu" id="v-add">
    <div class="m-head"><span class="t" data-t="Añadir cuenta sin premium"></span></div>
    <div class="m-list">
      <div class="form">
        <span class="t" data-t="Nombre de usuario" data-c="7"></span>
        <label class="field" id="nameField"><span class="t" id="nameTxt"></span><input id="nameInput" maxlength="16" spellcheck="false" autocomplete="off"></label>
        <span class="t" id="nameErr" data-c="c"></span>
        <span class="t" data-t="Al entrar en la network te pedirá tu contraseña" data-c="7"></span>
        <span class="t" data-t="(o crearla la primera vez). Los premium entran directos." data-c="7"></span>
      </div>
    </div>
    <div class="m-foot">
      <button class="mcbtn w196" id="addOk"><span class="t" data-t="Añadir"></span></button>
      <button class="mcbtn w196" data-goto="profile"><span class="t" data-t="Cancelar"></span></button>
    </div>
  </section>

  <!-- ============================================================ MICROSOFT -->
  <section class="view menu" id="v-ms">
    <div class="m-head"><span class="t" data-t="Iniciar sesión con Microsoft"></span></div>
    <div class="m-list">
      <div class="form center">
        <span class="t" id="msLine1" data-c="7"></span>
        <span class="t big" id="msCode"></span>
        <span class="t" id="msLine2" data-c="7"></span>
      </div>
    </div>
    <div class="m-foot">
      <button class="mcbtn w196" id="msOpen"><span class="t" data-t="Abrir la web"></span></button>
      <button class="mcbtn w196" data-goto="profile"><span class="t" data-t="Cancelar"></span></button>
    </div>
  </section>

  <!-- ============================================================ NOVEDADES -->
  <section class="view news-view" id="v-news">
    <div class="news-card">
      <span class="t" id="nwTitle"></span>
      <span class="t" id="nwSub"></span>
      <div class="nw-list" id="nwList"></div>
      <button class="mcbtn nw-ok" id="nwOk"><span class="t" id="nwOkT"></span></button>
    </div>
  </section>

  <!-- ============================================================ PRIMER ARRANQUE (sin texturas aun) -->
  <section class="boot" id="boot">
    <img src="img/zeres_network.png" alt="">
    <p id="bootText">Preparando el launcher...</p>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <small>La primera vez se descargan los recursos de Minecraft.</small>
  </section>
</div>
<script src="mcfont.js"></script>
<script src="app.js"></script>
</body>
</html>
